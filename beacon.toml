[server]
host = "0.0.0.0"
port = 4600

[database]
addrs = ["127.0.0.1:9000"]
database = "beacon"
username = "default"
password = ""
secure = false
read_pool_size = 8

[capture]
enabled = true
debounce_ms = 50
reconcile_interval = "30s"
backfill_on_start = true
backfill_workers = 4

[[capture.sources]]
name = "claude"
runtime = "claude-code"
provider = "anthropic"
glob = "~/.claude/projects/**/*.jsonl"
watch_root = "~/.claude/projects"
format = "jsonl"

[[capture.sources]]
name = "codex"
runtime = "codex"
provider = "openai"
glob = "~/.codex/sessions/**/*.jsonl"
watch_root = "~/.codex/sessions"
format = "jsonl"

[sse]
subscriber_buffer = 64

[search]
max_results = 25
rebuild_interval = "5m"

[pricing]
default_input_cost = 3.00
default_output_cost = 15.00

[mcp]
max_results = 25
context_window = 3
