[server]
host = "0.0.0.0"
port = 4600

[database]
addrs = ["127.0.0.1:9000"]
database = "beacon"
username = "default"
password = ""
secure = false
read_pool_size = 8

[capture]
enabled = true
debounce_ms = 50
reconcile_interval = "30s"
backfill_on_start = true
backfill_workers = 4

[[capture.sources]]
name = "claude"
runtime = "claude-code"
provider = "anthropic"
glob = "~/.claude/projects/**/*.jsonl"
watch_root = "~/.claude/projects"
format = "jsonl"

[[capture.sources]]
name = "codex"
runtime = "codex"
provider = "openai"
glob = "~/.codex/sessions/**/*.jsonl"
watch_root = "~/.codex/sessions"
format = "jsonl"

[[capture.sources]]
name = "hermes"
runtime = "hermes-agent"
provider = "multi"
glob = "~/.hermes/state.db"
watch_root = "~/.hermes"
format = "sqlite"

[[capture.sources]]
name = "opencode"
runtime = "opencode"
provider = "multi"
glob = "~/.local/share/opencode/opencode*.db"
watch_root = "~/.local/share/opencode"
format = "sqlite"

[[capture.sources]]
name = "pi"
runtime = "pi-coding-agent"
provider = "multi"
glob = "~/.pi/agent/sessions/**/*.jsonl"
watch_root = "~/.pi/agent/sessions"
format = "jsonl"

[sse]
subscriber_buffer = 64

[search]
max_results = 25
rebuild_interval = "5m"

[pricing]
default_input_cost = 3.00
default_output_cost = 15.00

[mcp]
max_results = 25
context_window = 3

[dashboard]
name = ""

[fleet]
role = "both"
metadata_path = "~/.beacon/control-plane.db"
control_plane_url = ""
node_id = ""
node_name = ""
collector_id = ""
