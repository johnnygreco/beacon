[server]
host = "0.0.0.0"
port = 4600

[database]
path = "technodrome.duckdb"
read_pool_size = 4

[ingestion]
batch_size = 500
flush_interval = "2s"
max_body_bytes = 4194304

[sse]
subscriber_buffer = 64

[search]
provider = "ollama"
model = "nomic-embed-text"
dimensions = 768

[search.ollama]
url = "http://localhost:11434"

[search.openai]
api_key = ""
model = "text-embedding-3-small"
dimensions = 1536

[pricing]
default_input_cost = 3.00
default_output_cost = 15.00
