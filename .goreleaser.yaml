version: 2

before:
  hooks:
    - go tool templ generate

builds:
  - id: beacon
    main: ./cmd/beacon
    binary: beacon
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

brews:
  - repository:
      owner: johnnygreco
      name: homebrew-tap
    homepage: https://github.com/johnnygreco/beacon
    description: A dashboard for monitoring Claude Code usage and costs

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
